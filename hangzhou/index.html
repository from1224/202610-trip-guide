<style>.swipe-launch{width:100%;margin:14px 0;border:0;border-radius:14px;min-height:48px;background:var(--accent);color:#fff;font:700 14px inherit}.swipe-panel{margin:0 0 14px;padding:14px;background:var(--card);border:1px solid var(--line);border-radius:18px}.swipe-panel[hidden]{display:none}.swipe-card{touch-action:pan-y;overflow:hidden;border-radius:14px;background:#f1f5f1}.swipe-card img{display:block;width:100%;max-height:280px;object-fit:contain;background:#e5eeea}.swipe-card h3{margin:12px 12px 4px}.swipe-card p{margin:4px 12px;color:var(--muted);font-size:13px}.swipe-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:12px}.swipe-actions button,.swipe-utility button{min-height:42px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);font:700 13px inherit}.swipe-actions .yes{background:#e5eeea}.swipe-actions .no{background:#f5d9d0}.swipe-utility{display:flex;gap:8px;margin-top:8px}.swipe-utility button{flex:1}.swipe-summary{margin-top:12px;font-size:13px}.swipe-summary button{margin:3px;padding:5px 8px;border:1px solid var(--line);border-radius:9px;background:#fff;font:inherit}</style>
<style>.event-poster{display:block;margin-top:12px;color:#286663;font-size:12px;text-decoration:none}.event-poster img{display:block;width:100%;max-width:100%;height:auto;max-height:430px;object-fit:contain;border:1px solid var(--line);border-radius:12px;background:#f1f5f1}.event-poster img[hidden]{display:none}.event-poster span{display:block;margin-top:4px;line-height:1.35}</style>
<style>:root{--ink:#183b3b;--muted:#637574;--bg:#f2f1eb;--card:#fffefa;--line:#d7ddd5;--accent:#d85c3f;--deep:#285e5a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 ui-sans-serif,system-ui,-apple-system,"PingFang SC",sans-serif}.app{max-width:540px;margin:auto;padding:18px 14px 40px}.hero{padding:22px 18px;background:linear-gradient(135deg,#244e4c,#306b66);color:#fff;border-radius:22px}.eyebrow{font-size:12px;letter-spacing:.1em;color:#bfe0d6}.hero h1{font:700 29px/1.12 ui-serif,Georgia,"Songti SC",serif;margin:8px 0}.hero p{margin:0;color:#e2eee9;font-size:14px}.filters{display:flex;gap:8px;overflow:auto;padding:15px 0 9px;scrollbar-width:none}.filter{white-space:nowrap;min-height:42px;padding:0 13px;border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--ink);font:600 13px inherit}.filter[aria-pressed="true"]{background:var(--deep);border-color:var(--deep);color:#fff}.section{display:flex;align-items:baseline;justify-content:space-between;margin:13px 2px 10px}.section h2{font-size:18px;margin:0}.section small{color:var(--muted)}.stack{display:grid;gap:11px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 7px 18px #163c3710}.card[hidden]{display:none}.topline{display:flex;gap:8px;justify-content:space-between;align-items:start}.kind{font-size:12px;color:var(--accent);font-weight:800}.date{font-size:12px;color:var(--muted);text-align:right}.card h3{font-size:19px;line-height:1.25;margin:7px 0 4px}.sub,.summary{margin:0;color:var(--muted);font-size:14px}.meta{display:grid;gap:4px;border-top:1px solid #edf0ea;margin-top:12px;padding-top:10px;font-size:13px}.meta b{color:var(--ink)}details{margin-top:12px;background:#f1f5f1;border-radius:12px;padding:0 11px}summary{min-height:42px;display:flex;align-items:center;font-weight:700;font-size:13px;cursor:pointer}.links{padding:0 0 11px;font-size:13px}.links a{display:block;color:#286663;margin:6px 0;overflow-wrap:anywhere}.actions{display:flex;gap:8px;margin-top:13px}.action{min-height:44px;border:0;border-radius:11px;padding:0 13px;background:#e5eeea;color:#22544f;font:700 13px inherit}.action.saved{background:#f5d9d0;color:#99412b}.local-note{margin:18px 2px;color:var(--muted);font-size:12px}.empty{padding:20px;color:var(--muted);text-align:center}.archive .card{opacity:.6}.poster-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.poster{display:block;color:#286663;font-size:12px;text-decoration:none}.poster img{display:block;width:100%;max-width:100%;height:132px;object-fit:cover;border:1px solid var(--line);border-radius:12px;background:#e5eeea}.poster img[hidden]{display:none}.poster span{display:block;margin-top:4px;line-height:1.35}@media(max-width:350px){.app{padding-inline:10px}.hero{padding:19px 15px}.hero h1{font-size:26px}.poster-grid{grid-template-columns:1fr}.poster img{height:auto;max-height:260px}}</style>
<body>

<script>const $=s=>document.querySelector(s),today=new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Shanghai'});let items=[];function dateLabel(x){if(x.status==='permanent')return'长期去处';if(!x.dateStart)return x.dateEnd?'起日待复核 · 截止 '+x.dateEnd:'日期待复核';return x.dateStart===x.dateEnd?x.dateStart:(x.dateEnd?x.dateStart+' 至 '+x.dateEnd:'结束待复核')}function card(x){

let k='hz:'+x.id,state=localStorage.getItem(k)||'',ex=x.exhibitions?'<p class="summary">'+x.summary+'</p>':'',posters={'zju-art-museum-plum':['https://zjumaa.zju.edu.cn/_upload/article/images/5e/75/a9b956fb4f5285ffb7e0433073e7/09b5690e-e170-4ee7-a541-7afa4af1fd02.jpg','https://zjumaa.zju.edu.cn/_s186/main.psp','浙大艺博官方展览海报：梅花知己'],'zjam-october-exhibitions':['https://www.zjam.org.cn/SiteAdmin/Holding/Logo/20260930115310.jpg','https://www.zjam.org.cn/site/exbition/ExbitionDetail.aspx?etid=2910&type=1','浙江美术馆官方展览海报：寻找方幹民'],'shye-return-hangzhou':['https://s2.showstart.com/img/2026/0923/18/30/f9690d19a82d43768691d5b85aa6607c_2160_2700_3640465.0x0.png','https://www.uniuni.live/zh','UN! / Team Uni 官方排期海报：Shye Return']};Object.assign(posters,{"pending-liangzhu-creative-market":["https://meizi-chao-pub.8531.cn/2109842336568393728_1280px.png?height=685&width=1280","https://tidenews.com.cn/news.html?id=3583580","潮新闻来源图：2026良渚文创市集"],"pending-bread":["https://mc-gxlmmz-public.8531.cn/17887302285064.png","https://tidenews.com.cn/tmh_news.html?id=6ac9dbbabe449b000197c8ec","潮新闻来源图：就叫面包节"],"pending-tianmuli-fiber-festival":["./images/fiber-festival.jpg","https://www.sina.cn/news/detail/5353523489540363.html","博主实发海报：好好织时节"],"pending-flower":["./images/flower-jazz.jpg","https://pic.hangzhou.com.cn/hzyx/content/content_9324356.html","杭州日报佐证图：花朵爵士公园"],"pending-pet-forest-market":["./images/pet-forest-market.jpg","https://www.chongyejia.com/projects/hangzhou-autumn","宠业家官方计划海报：毛孩森活集（待最终公告）"]});let poster=posters[x.id],visual=poster?`<a class="event-poster" href="${poster[1]}" target="_blank" rel="noreferrer"><img loading="lazy" referrerpolicy="no-referrer" alt="" src="${poster[0]}"><span>图片：${poster[2]} · 查看官方来源</span></a>`:'';
return `<article class="card" data-kind="${x.kind}" data-area="${x.area}" data-free="${x.price.includes('免费')}">
<div class="topline">
<span class="kind">${x.kind} · ${x.area}</span>
<span class="date">${dateLabel(x)}</span>
</div>
<h3>${x.title}</h3>
<p class="sub">${x.subtitle}</p>${ex}${visual}<div class="meta">
<div>
<b>${x.schedule}</b>
</div>
<div>${x.venue} · ${x.address}</div>
<div>${x.price}</div>
<div>${x.booking}</div>
</div>
<details>
<summary>来源与详情</summary>
<div class="links">${(x.exhibitions||[]).map(e=>`<a href="${e[2]}" target="_blank" rel="noreferrer">${e[0]} · ${e[1]}</a>`).join('')}${x.sources.map(s=>`<a href="${s[1]}" target="_blank" rel="noreferrer">${s[0]}</a>`).join('')}</div>
</details>
<div class="actions">
<button class="action ${state==='want'?'saved':''}" data-save="want" data-id="${x.id}">${state==='want'?'已想去':'想去'}</button>
<button class="action ${state==='done'?'saved':''}" data-save="done" data-id="${x.id}">${state==='done'?'已去过':'去过'}</button>
</div>
</article>`}function bucket(x){if(x.status!=='permanent'&&x.dateEnd&&x.dateEnd<today)return'archive';return['active','pending','permanent','archived'].includes(x.status)?(x.status==='archived'?'archive':x.status):'pending'}function render(){let groups={active:[],pending:[],permanent:[],archive:[]};items.forEach(x=>groups[bucket(x)].push(card(x)));for(const [name,html] of Object.entries(groups)){let wrap=$('#'+name+'Wrap'),target=$('#'+name);if(name==='active'){target.innerHTML=html.join('')||'<p class="empty">本周暂未有已核活动。</p>';continue}wrap.hidden=!html.length;target.innerHTML=html.join('')}bind()}function bind(){document.querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>{let key='hz:'+b.dataset.id,active=localStorage.getItem(key)===b.dataset.save;if(active)localStorage.removeItem(key);else localStorage.setItem(key,b.dataset.save);let c=b.closest('.card');c.querySelectorAll('[data-save]').forEach(x=>{let on=localStorage.getItem('hz:'+x.dataset.id)===x.dataset.save;x.classList.toggle('saved',on);x.textContent=x.dataset.save==='want'?(on?'已想去':'想去'):(on?'已去过':'去过')})});document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{document.querySelectorAll('.filter').forEach(q=>q.setAttribute('aria-pressed',q===b));let f=b.dataset.filter;document.querySelectorAll('.card').forEach(c=>c.hidden=f!=='all'&&!c.dataset.kind.includes(f)&&!c.dataset.area.includes(f)&&!(f==='免费'&&c.dataset.free==='true'))});document.querySelectorAll('.poster img,.event-poster img').forEach(img=>img.addEventListener('error',()=>{img.hidden=true;const label=img.nextElementSibling;if(label)label.textContent="图片当前未加载 · 查看官方来源"},{once:true}))}fetch('./data.json').then(r=>{if(!r.ok)throw Error('活动数据读取失败');return r.json()}).then(d=>{items=d.items;$('#week').textContent=d.meta.weekLabel+' · 已核活动与待核线索分开显示';$('#checked').textContent='核查 '+d.meta.checkedAt;render()}).catch(()=>$('#active').innerHTML='<p class="empty">活动数据暂时无法读取，请稍后重试。</p>')</script>

<script>(()=>{const pic={"pending-pet-forest-market":"./images/pet-forest-market.jpg","pending-tianmuli-fiber-festival":"./images/fiber-festival.jpg","pending-flower":"./images/flower-jazz.jpg"},key=x=>'hz:'+x.id+':swipe',name={yes:'感兴趣',no:'不感兴趣',maybe:'待定',none:'尚未筛选'};function start(){if(!items.length||document.querySelector('.swipe-panel'))return;let include=false,done=false,undo=[];const host=document.createElement('section');host.innerHTML='<button class="swipe-launch">用滑卡筛选本周活动</button><button class="swipe-launch" data-inc>包含待核线索：关</button><section class="swipe-panel" hidden><div class="swipe-card"></div><div class="swipe-actions"><button data-v="no">不感兴趣</button><button data-v="maybe">待定</button><button data-v="yes">感兴趣</button></div><div class="swipe-utility"><button data-u="undo">撤销上一张</button><button data-u="finish">结束筛选</button></div><div class="swipe-summary"></div></section>';document.querySelector('#active').before(host);const panel=host.querySelector('.swipe-panel'),card=host.querySelector('.swipe-card'),summary=host.querySelector('.swipe-summary'),pool=()=>items.filter(x=>bucket(x)==='active'||include&&bucket(x)==='pending'),state=x=>localStorage.getItem(key(x))||'none',queue=()=>pool().filter(x=>state(x)==='none');function renderSummary(){const p=pool(),left=queue().length;summary.innerHTML=['yes','no','maybe','none'].map(s=>`<p><b>${name[s]}（${p.filter(x=>state(x)===s).length}）</b></p>`).join('')+(left?`<button data-u="continue">继续未筛选（${left}）</button>`:'<p>本轮筛选已完成。</p>')}function renderCard(){const q=queue();if(done||!q.length){card.innerHTML=done&&q.length?`<p>已结束筛选；尚余 ${q.length} 项未筛选。</p>`:'<p>本轮筛选已完成。</p>';renderSummary();return}const x=q[0];card.innerHTML=`${pic[x.id]?`<img src="${pic[x.id]}" alt="${x.title} 海报">`:''}<h3>${x.title}</h3><p>${dateLabel(x)} · ${x.venue}</p><p>${x.price}</p>`;renderSummary()}function decide(v){const x=queue()[0];if(!x)return renderCard();undo.push([x.id,state(x)]);localStorage.setItem(key(x),v);done=false;renderCard()}host.querySelector('.swipe-launch').onclick=()=>{panel.hidden=!panel.hidden;renderCard()};host.querySelector('[data-inc]').onclick=e=>{include=!include;e.target.textContent='包含待核线索：'+(include?'开':'关');done=false;renderCard()};host.querySelector('.swipe-actions').onclick=e=>e.target.dataset.v&&decide(e.target.dataset.v);host.querySelector('.swipe-utility').onclick=e=>{if(e.target.dataset.u==='finish'){done=true;renderCard()}if(e.target.dataset.u==='continue'){done=false;renderCard()}if(e.target.dataset.u==='undo'){const z=undo.pop();if(z){z[1]==='none'?localStorage.removeItem('hz:'+z[0]+':swipe'):localStorage.setItem('hz:'+z[0]+':swipe',z[1])}done=false;renderCard()}}}new MutationObserver(start).observe(document.querySelector('#active'),{childList:true});start()})()</script>
</body>
