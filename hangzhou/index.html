<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>杭州这周玩什么</title><style>:root{--ink:#183b3b;--muted:#637574;--bg:#f2f1eb;--card:#fffefa;--line:#d7ddd5;--accent:#d85c3f;--deep:#285e5a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 ui-sans-serif,system-ui,-apple-system,"PingFang SC",sans-serif}.app{max-width:540px;margin:auto;padding:18px 14px 40px}.hero{padding:22px 18px;background:linear-gradient(135deg,#244e4c,#306b66);color:#fff;border-radius:22px}.eyebrow{font-size:12px;letter-spacing:.1em;color:#bfe0d6}.hero h1{font:700 29px/1.12 ui-serif,Georgia,"Songti SC",serif;margin:8px 0}.hero p{margin:0;color:#e2eee9;font-size:14px}.filters{display:flex;gap:8px;overflow:auto;padding:15px 0 9px;scrollbar-width:none}.filter{white-space:nowrap;min-height:42px;padding:0 13px;border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--ink);font:600 13px inherit}.filter[aria-pressed="true"]{background:var(--deep);border-color:var(--deep);color:#fff}.section{display:flex;align-items:baseline;justify-content:space-between;margin:13px 2px 10px}.section h2{font-size:18px;margin:0}.section small{color:var(--muted)}.stack{display:grid;gap:11px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 7px 18px #163c3710}.card[hidden]{display:none}.topline{display:flex;gap:8px;justify-content:space-between;align-items:start}.kind{font-size:12px;color:var(--accent);font-weight:800}.date{font-size:12px;color:var(--muted);text-align:right}.card h3{font-size:19px;line-height:1.25;margin:7px 0 4px}.sub,.summary{margin:0;color:var(--muted);font-size:14px}.meta{display:grid;gap:4px;border-top:1px solid #edf0ea;margin-top:12px;padding-top:10px;font-size:13px}.meta b{color:var(--ink)}details{margin-top:12px;background:#f1f5f1;border-radius:12px;padding:0 11px}summary{min-height:42px;display:flex;align-items:center;font-weight:700;font-size:13px;cursor:pointer}.links{padding:0 0 11px;font-size:13px}.links a{display:block;color:#286663;margin:6px 0;overflow-wrap:anywhere}.actions{display:flex;gap:8px;margin-top:13px}.action{min-height:44px;border:0;border-radius:11px;padding:0 13px;background:#e5eeea;color:#22544f;font:700 13px inherit}.action.saved{background:#f5d9d0;color:#99412b}.local-note{margin:18px 2px;color:var(--muted);font-size:12px}.empty{padding:20px;color:var(--muted);text-align:center}.archive .card{opacity:.6}@media(max-width:350px){.app{padding-inline:10px}.hero{padding:19px 15px}.hero h1{font-size:26px}}</style><body><main class="app"><header class="hero"><div class="eyebrow">HANGZHOU · 活动卡</div><h1>杭州这周玩什么</h1><p id="week">正在读取本周活动</p></header><nav class="filters" aria-label="活动筛选"><button class="filter" data-filter="all" aria-pressed="true">全部</button><button class="filter" data-filter="展览" aria-pressed="false">展览</button><button class="filter" data-filter="演出" aria-pressed="false">演出</button><button class="filter" data-filter="西湖区" aria-pressed="false">西湖区</button><button class="filter" data-filter="拱墅区" aria-pressed="false">拱墅区</button><button class="filter" data-filter="免费" aria-pressed="false">免费</button></nav><div class="section"><h2>本周活动</h2><small id="checked"></small></div><section class="stack" id="active"></section><section id="archiveWrap" hidden><div class="section"><h2>已归档</h2><small>日期已过</small></div><section class="stack archive" id="archive"></section></section><p class="local-note">“想去 / 去过”只保存于这台设备的浏览器，不会同步或提交；票价与余票以链接页当时信息为准。</p></main><script>const $=s=>document.querySelector(s),today=new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Shanghai'});let items=[];function card(x){let gone=x.dateEnd&&x.dateEnd<today,ds=x.dateStart===x.dateEnd?x.dateStart:(x.dateEnd?x.dateStart+' 至 '+x.dateEnd:'本周观察 · 结束待复核'),k='hz:'+x.id,state=localStorage.getItem(k)||'',ex=x.exhibitions?'<p class="summary">'+x.summary+'</p>':'';return `<article class="card" data-kind="${x.kind}" data-area="${x.area}" data-free="${x.price.includes('免费')}"><div class="topline"><span class="kind">${x.kind} · ${x.area}</span><span class="date">${ds}</span></div><h3>${x.title}</h3><p class="sub">${x.subtitle}</p>${ex}<div class="meta"><div><b>${x.schedule}</b></div><div>${x.venue} · ${x.address}</div><div>${x.price}</div><div>${x.booking}</div></div><details><summary>来源与详情</summary><div class="links">${(x.exhibitions||[]).map(e=>`<a href="${e[2]}" target="_blank" rel="noreferrer">${e[0]} · ${e[1]}</a>`).join('')}${x.sources.map(s=>`<a href="${s[1]}" target="_blank" rel="noreferrer">${s[0]}</a>`).join('')}</div></details><div class="actions"><button class="action ${state==='want'?'saved':''}" data-save="want" data-id="${x.id}">${state==='want'?'已想去':'想去'}</button><button class="action ${state==='done'?'saved':''}" data-save="done" data-id="${x.id}">${state==='done'?'已去过':'去过'}</button></div></article>`}fetch('./data.json').then(r=>r.json()).then(d=>{items=d.items;$('#week').textContent=d.meta.weekLabel+' · 先看这四张卡';$('#checked').textContent='核查 '+d.meta.checkedAt;let a=[],p=[];items.forEach(x=>((x.dateEnd&&x.dateEnd<today)?p:a).push(card(x)));$('#active').innerHTML=a.join('')||'<p class="empty">本周暂未有已核活动。</p>';if(p.length){$('#archiveWrap').hidden=false;$('#archive').innerHTML=p.join('')}bind()});function bind(){document.querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>{let key='hz:'+b.dataset.id,active=localStorage.getItem(key)===b.dataset.save;if(active){localStorage.removeItem(key)}else{localStorage.setItem(key,b.dataset.save)};let card=b.closest('.card');card.querySelectorAll('[data-save]').forEach(x=>{let on=localStorage.getItem('hz:'+x.dataset.id)===x.dataset.save;x.classList.toggle('saved',on);x.textContent=x.dataset.save==='want'?(on?'已想去':'想去'):(on?'已去过':'去过')})});document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{document.querySelectorAll('.filter').forEach(q=>q.setAttribute('aria-pressed',q===b));let f=b.dataset.filter;document.querySelectorAll('.card').forEach(c=>c.hidden=f!=='all'&&!c.dataset.kind.includes(f)&&!c.dataset.area.includes(f)&&!(f==='免费'&&c.dataset.free==='true'))})}</script></body></html>
