<!doctype html>
<html lang="zh-CN">

<style>.event-poster{display:block;margin-top:12px;color:#286663;font-size:12px;text-decoration:none}.event-poster img{display:block;width:100%;max-width:100%;height:auto;max-height:430px;object-fit:contain;border:1px solid var(--line);border-radius:12px;background:#f1f5f1}.event-poster img[hidden]{display:none}.event-poster span{display:block;margin-top:4px;line-height:1.35}</style>
<style>:root{--ink:#183b3b;--muted:#637574;--bg:#f2f1eb;--card:#fffefa;--line:#d7ddd5;--accent:#d85c3f;--deep:#285e5a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 ui-sans-serif,system-ui,-apple-system,"PingFang SC",sans-serif}.app{max-width:540px;margin:auto;padding:18px 14px 40px}.hero{padding:22px 18px;background:linear-gradient(135deg,#244e4c,#306b66);color:#fff;border-radius:22px}.eyebrow{font-size:12px;letter-spacing:.1em;color:#bfe0d6}.hero h1{font:700 29px/1.12 ui-serif,Georgia,"Songti SC",serif;margin:8px 0}.hero p{margin:0;color:#e2eee9;font-size:14px}.filters{display:flex;gap:8px;overflow:auto;padding:15px 0 9px;scrollbar-width:none}.filter{white-space:nowrap;min-height:42px;padding:0 13px;border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--ink);font:600 13px inherit}.filter[aria-pressed="true"]{background:var(--deep);border-color:var(--deep);color:#fff}.section{display:flex;align-items:baseline;justify-content:space-between;margin:13px 2px 10px}.section h2{font-size:18px;margin:0}.section small{color:var(--muted)}.stack{display:grid;gap:11px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 7px 18px #163c3710}.card[hidden]{display:none}.topline{display:flex;gap:8px;justify-content:space-between;align-items:start}.kind{font-size:12px;color:var(--accent);font-weight:800}.date{font-size:12px;color:var(--muted);text-align:right}.card h3{font-size:19px;line-height:1.25;margin:7px 0 4px}.sub,.summary{margin:0;color:var(--muted);font-size:14px}.meta{display:grid;gap:4px;border-top:1px solid #edf0ea;margin-top:12px;padding-top:10px;font-size:13px}.meta b{color:var(--ink)}details{margin-top:12px;background:#f1f5f1;border-radius:12px;padding:0 11px}summary{min-height:42px;display:flex;align-items:center;font-weight:700;font-size:13px;cursor:pointer}.links{padding:0 0 11px;font-size:13px}.links a{display:block;color:#286663;margin:6px 0;overflow-wrap:anywhere}.actions{display:flex;gap:8px;margin-top:13px}.action{min-height:44px;border:0;border-radius:11px;padding:0 13px;background:#e5eeea;color:#22544f;font:700 13px inherit}.action.saved{background:#f5d9d0;color:#99412b}.local-note{margin:18px 2px;color:var(--muted);font-size:12px}.empty{padding:20px;color:var(--muted);text-align:center}.archive .card{opacity:.6}.poster-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.poster{display:block;color:#286663;font-size:12px;text-decoration:none}.poster img{display:block;width:100%;max-width:100%;height:132px;object-fit:cover;border:1px solid var(--line);border-radius:12px;background:#e5eeea}.poster img[hidden]{display:none}.poster span{display:block;margin-top:4px;line-height:1.35}@media(max-width:350px){.app{padding-inline:10px}.hero{padding:19px 15px}.hero h1{font-size:26px}.poster-grid{grid-template-columns:1fr}.poster img{height:auto;max-height:260px}}</style>
<body>
<main class="app">
<header class="hero">
<div class="eyebrow">HANGZHOU · 活动卡</div>
<h1>杭州这周玩什么</h1>
<p id="week">正在读取本周活动</p>
</header>
<nav class="filters" aria-label="活动筛选">
<button class="filter" data-filter="all" aria-pressed="true">全部</button>
<button class="filter" data-filter="展览" aria-pressed="false">展览</button>
<button class="filter" data-filter="演出" aria-pressed="false">演出</button>
<button class="filter" data-filter="西湖区" aria-pressed="false">西湖区</button>
<button class="filter" data-filter="拱墅区" aria-pressed="false">拱墅区</button>
<button class="filter" data-filter="免费" aria-pressed="false">免费</button>
</nav>
<div class="section">
<h2>本周活动</h2>
<small id="checked">
</small>
</div>
<section class="stack" id="active">
</section>
<section id="pendingWrap" hidden>
<div class="section">
<h2>待核活动</h2>
<small>海报线索，非官方核实</small>
</div>
<p class="local-note">以下为 2026-10-14 读取的小红书海报线索。尚未逐项独立打开验证；日期、场地、费用均须出行前通过官方渠道复核。</p>
<section class="poster-reference" aria-labelledby="posterHeading">
<div class="section">
<h2 id="posterHeading">待核海报参考</h2>
<small>汇总图，非单活动专属</small>
</div>
<p class="local-note">三张均来自同一篇公开汇总帖，只作待核线索参考；查看原帖核对每项活动。</p>
<div class="poster-grid">
<a class="poster" href="https://www.xiaohongshu.com/explore/6acf4c8000000000140398ac?xsec_token=ABIYCzVVyoMxslc20xu__nhBYtyO2W-4wZ2w14YEQ-JPY=&amp;xsec_source=pc_search&amp;source=web_explore_feed" target="_blank" rel="noreferrer">
<img loading="lazy" alt="良渚秋社、好好织时节、面包节汇总海报" src="https://sns-webpic-qc.xhscdn.com/202610142325/66858908f3010894d38be20f80957368/notes_pre_post/1040g3k8326a4a4t4kebg5o1jmqm09clg3u4nct8!nd_dft_wlteh_webp_3">
<span>图 1 · 查看原帖</span>
</a>
<a class="poster" href="https://www.xiaohongshu.com/explore/6acf4c8000000000140398ac?xsec_token=ABIYCzVVyoMxslc20xu__nhBYtyO2W-4wZ2w14YEQ-JPY=&amp;xsec_source=pc_search&amp;source=web_explore_feed" target="_blank" rel="noreferrer">
<img loading="lazy" alt="女子美学节、良渚文创、大娃怪市汇总海报" src="https://sns-webpic-qc.xhscdn.com/202610142325/aaed8e973d231df07629197fd6407fbd/notes_pre_post/1040g3k8326a4a4t4ke9g5o1jmqm09clgr90naj0!nd_dft_wlteh_webp_3">
<span>图 3 · 查看原帖</span>
</a>
<a class="poster" href="https://www.xiaohongshu.com/explore/6acf4c8000000000140398ac?xsec_token=ABIYCzVVyoMxslc20xu__nhBYtyO2W-4wZ2w14YEQ-JPY=&amp;xsec_source=pc_search&amp;source=web_explore_feed" target="_blank" rel="noreferrer">
<img loading="lazy" alt="乌厩、贴贴、之江银泰汇总海报" src="https://sns-webpic-qc.xhscdn.com/202610142325/3b34a0fc4ed7f160660f4de14c697d4/notes_pre_post/1040g3k8326a4a4t4keag5o1jmqm09clghoto5m8!nd_dft_wlteh_webp_3">
<span>图 5 · 查看原帖</span>
</a>
</div>
</section>
<section class="stack" id="pending">
</section>
</section>
<section id="permanentWrap" hidden>
<div class="section">
<h2>长期去处</h2>
<small>候选，不是已确认行程</small>
</div>
<section class="stack" id="permanent">
</section>
</section>
<section id="archiveWrap" hidden>
<div class="section">
<h2>已归档</h2>
<small>历史活动，不代表当前可用</small>
</div>
<section class="stack archive" id="archive">
</section>
</section>
<p class="local-note">“想去 / 去过”只保存于这台设备的浏览器，不会同步或提交；票价与余票以链接页当时信息为准。</p>
</main>
<script>const $=s=>document.querySelector(s),today=new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Shanghai'});let items=[];function dateLabel(x){if(x.status==='permanent')return'长期去处';if(!x.dateStart)return x.dateEnd?'起日待复核 · 截止 '+x.dateEnd:'日期待复核';return x.dateStart===x.dateEnd?x.dateStart:(x.dateEnd?x.dateStart+' 至 '+x.dateEnd:'结束待复核')}function card(x){

let k='hz:'+x.id,state=localStorage.getItem(k)||'',ex=x.exhibitions?'<p class="summary">'+x.summary+'</p>':'',posters={'zju-art-museum-plum':['https://zjumaa.zju.edu.cn/_upload/article/images/5e/75/a9b956fb4f5285ffb7e0433073e7/09b5690e-e170-4ee7-a541-7afa4af1fd02.jpg','https://zjumaa.zju.edu.cn/_s186/main.psp','浙大艺博官方展览海报：梅花知己'],'zjam-october-exhibitions':['https://www.zjam.org.cn/SiteAdmin/Holding/Logo/20260930115310.jpg','https://www.zjam.org.cn/site/exbition/ExbitionDetail.aspx?etid=2910&type=1','浙江美术馆官方展览海报：寻找方幹民'],'shye-return-hangzhou':['https://s2.showstart.com/img/2026/0923/18/30/f9690d19a82d43768691d5b85aa6607c_2160_2700_3640465.0x0.png','https://www.uniuni.live/zh','UN! / Team Uni 官方排期海报：Shye Return']},poster=posters[x.id],visual=poster?`<a class="event-poster" href="${poster[1]}" target="_blank" rel="noreferrer"><img loading="lazy" alt="${poster[2]}" src="${poster[0]}"><span>图片：${poster[2]} · 查看官方来源</span></a>`:'';
return `<article class="card" data-kind="${x.kind}" data-area="${x.area}" data-free="${x.price.includes('免费')}">
<div class="topline">
<span class="kind">${x.kind} · ${x.area}</span>
<span class="date">${dateLabel(x)}</span>
</div>
<h3>${x.title}</h3>
<p class="sub">${x.subtitle}</p>${ex}${visual}<div class="meta">
<div>
<b>${x.schedule}</b>
</div>
<div>${x.venue} · ${x.address}</div>
<div>${x.price}</div>
<div>${x.booking}</div>
</div>
<details>
<summary>来源与详情</summary>
<div class="links">${(x.exhibitions||[]).map(e=>`<a href="${e[2]}" target="_blank" rel="noreferrer">${e[0]} · ${e[1]}</a>`).join('')}${x.sources.map(s=>`<a href="${s[1]}" target="_blank" rel="noreferrer">${s[0]}</a>`).join('')}</div>
</details>
<div class="actions">
<button class="action ${state==='want'?'saved':''}" data-save="want" data-id="${x.id}">${state==='want'?'已想去':'想去'}</button>
<button class="action ${state==='done'?'saved':''}" data-save="done" data-id="${x.id}">${state==='done'?'已去过':'去过'}</button>
</div>
</article>`}function bucket(x){if(x.status!=='permanent'&&x.dateEnd&&x.dateEnd<today)return'archive';return['active','pending','permanent','archived'].includes(x.status)?(x.status==='archived'?'archive':x.status):'pending'}function render(){let groups={active:[],pending:[],permanent:[],archive:[]};items.forEach(x=>groups[bucket(x)].push(card(x)));for(const [name,html] of Object.entries(groups)){let wrap=$('#'+name+'Wrap'),target=$('#'+name);if(name==='active'){target.innerHTML=html.join('')||'<p class="empty">本周暂未有已核活动。</p>';continue}wrap.hidden=!html.length;target.innerHTML=html.join('')}bind()}function bind(){document.querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>{let key='hz:'+b.dataset.id,active=localStorage.getItem(key)===b.dataset.save;if(active)localStorage.removeItem(key);else localStorage.setItem(key,b.dataset.save);let c=b.closest('.card');c.querySelectorAll('[data-save]').forEach(x=>{let on=localStorage.getItem('hz:'+x.dataset.id)===x.dataset.save;x.classList.toggle('saved',on);x.textContent=x.dataset.save==='want'?(on?'已想去':'想去'):(on?'已去过':'去过')})});document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{document.querySelectorAll('.filter').forEach(q=>q.setAttribute('aria-pressed',q===b));let f=b.dataset.filter;document.querySelectorAll('.card').forEach(c=>c.hidden=f!=='all'&&!c.dataset.kind.includes(f)&&!c.dataset.area.includes(f)&&!(f==='免费'&&c.dataset.free==='true'))});document.querySelectorAll('.poster img,.event-poster img').forEach(img=>img.addEventListener('error',()=>img.hidden=true,{once:true}))}fetch('./data.json').then(r=>{if(!r.ok)throw Error('活动数据读取失败');return r.json()}).then(d=>{items=d.items;$('#week').textContent=d.meta.weekLabel+' · 已核活动与待核线索分开显示';$('#checked').textContent='核查 '+d.meta.checkedAt;render()}).catch(()=>$('#active').innerHTML='<p class="empty">活动数据暂时无法读取，请稍后重试。</p>')</script>
</body>
</html>
