<rect x="20" y="962" width="680" height="250" rx="16" class="p"/><text x="42" y="995" class="n">③ 杭钢园内放大（南区短线）</text><path d="M95 1140L240 1080 375 1035 510 1080 375 1035 240 1080 95 1140" class="r" stroke="#c99618" marker-end="url(#a)"/><text x="47" y="1182" class="n">杭钢南出入口</text><text x="185" y="1122" class="n">二三号炉外观</text><text x="335" y="1018" class="n">倒影池</text><text x="472" y="1122" class="n">中央草坪南缘</text><text x="42" y="1238" class="s">黄 · 南入口广场附近 → 二三号炉 → 倒影池 → 草坪南缘 → 回南区</text><text x="42" y="1260" class="s">不默认延伸至西南的 1 号炉；现场道路与管制优先。</text></svg>
