<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1280"><defs><style>text{font-family:Arial,'PingFang SC';fill:#173327}.h{font-size:24px;font-weight:bold}.n{font-size:18px;font-weight:bold}.s{font-size:15px;fill:#536d61}.p{fill:#fff;stroke:#d7e5da;stroke-width:2}.r{fill:none;stroke-width:10;stroke-linecap:round;stroke-linejoin:round}.d{stroke:#fff;stroke-width:4}</style><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0v6l8-3z" fill="context-stroke"/></marker></defs><rect width="720" height="1280" fill="#f4f8f3"/><text x="28" y="40" class="h">半山 × 杭钢：接驳与园内怎么走</text><text x="28" y="66" class="s">非比例路线图；箭头是行进方向。彩色仅为本站按来源区分。</text>
<rect x="20" y="88" width="680" height="190" rx="16" class="p"/><text x="42" y="120" class="n">① 城市接驳（高德）</text><path d="M95 190H305" class="r" stroke="#2879ca" marker-end="url(#a)"/><path d="M345 190H590" class="r" stroke="#d66551" stroke-dasharray="12 10" marker-end="url(#a)"/><g class="n"><text x="48" y="230">桃源街 A 口</text><text x="242" y="230">明园路28号咨询中心／南门</text><text x="517" y="230">杭钢南出入口</text></g><text x="105" y="170" class="s">1.74 km／23 分</text><text x="405" y="170" class="s">2.42 km／32 分</text>
<rect x="20" y="300" width="680" height="640" rx="16" class="p"/><text x="42" y="334" class="n">② 半山园内放大（各篇路线不混写）</text><text x="42" y="357" class="s">从明园路28号咨询中心／南门接入；作者未核的山径不作导航。</text>
<path d="M110 845L200 690 330 535 430 430 330 535 200 690 110 845" class="r" stroke="#ef9b32" marker-end="url(#a)"/><text x="52" y="885" class="s">橙 · 双宝：咨询中心接入后 → 娘娘庙 → 望宸阁 → 原路返回</text>
